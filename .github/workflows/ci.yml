name: CI

on:
  push:
    branches:
      - development
      - linux
      - 'linux-release-*'
    tags:
      - 'release-*.*.*'
      - 'release-*.*.*-*'
  pull_request:
    branches:
      - linux
      - 'linux-release-*'
  workflow_call:
    inputs:
      repository:
        default: desktop/desktop
        required: false
        type: string
      ref:
        required: true
        type: string
      upload-artifacts:
        default: false
        required: false
        type: boolean
      environment:
        type: string
        required: true
      sign:
        type: boolean
        default: true
        required: false
    secrets:
      AZURE_CODE_SIGNING_TENANT_ID:
      AZURE_CODE_SIGNING_CLIENT_ID:
      DESKTOP_OAUTH_CLIENT_ID:
      DESKTOP_OAUTH_CLIENT_SECRET:
      APPLE_ID:
      APPLE_ID_PASSWORD:
      APPLE_TEAM_ID:
      APPLE_APPLICATION_CERT:
      APPLE_APPLICATION_CERT_PASSWORD:

env:
  NODE_VERSION: 24.11.1

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_CHANNEL: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - run: yarn
      - run: yarn validate-electron-version
      - run: yarn lint
      - run: yarn validate-changelog
      - name: Ensure a clean working directory
        run: git diff --name-status --exit-code
  build:
    name: ${{ matrix.friendlyName }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-2022]
        arch: [x64, arm64]
        include:
          - os: macos-latest
            friendlyName: macOS
          - os: windows-2022
            friendlyName: Windows
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    env:
      RELEASE_CHANNEL: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          submodules: recursive
      - uses: ./.github/actions/setup-ci-environment
        with:
          node-version: ${{ env.NODE_VERSION }}
          arch: ${{ matrix.arch }}
      - name: Validate macOS version
        if: runner.os == 'macOS'
        run: yarn validate-macos-version
      - name: Run desktop-trampoline tests
        run: |
          cd vendor/desktop-trampoline
          yarn install
          yarn test
      - name: Build production app
        run: yarn build:prod
        env:
          DESKTOP_OAUTH_CLIENT_ID: ${{ secrets.DESKTOP_OAUTH_CLIENT_ID }}
          DESKTOP_OAUTH_CLIENT_SECRET:
            ${{ secrets.DESKTOP_OAUTH_CLIENT_SECRET }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APPLICATION_CERT: ${{ secrets.APPLE_APPLICATION_CERT }}
          KEY_PASSWORD: ${{ secrets.APPLE_APPLICATION_CERT_PASSWORD }}
          npm_config_arch: ${{ matrix.arch }}
          TARGET_ARCH: ${{ matrix.arch }}
      - name: Prepare testing environment
        run: yarn test:setup
        env:
          npm_config_arch: ${{ matrix.arch }}
      - name: Run unit tests
        if: |
          (runner.os == 'Windows' && matrix.arch == 'x64') || (runner.os == 'macOS' && matrix.arch == 'arm64')
        run: yarn test:unit
      - name: Run script tests
        run: yarn test:script
      - if: runner.os == 'Windows'
        uses: ./.github/actions/setup-windows-signing
        with:
          enabled: ${{ inputs.sign }}
          azure-client-id: ${{ secrets.AZURE_CODE_SIGNING_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_CODE_SIGNING_TENANT_ID }}
      - name: Package production app
        run: yarn package
        env:
          npm_config_arch: ${{ matrix.arch }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_CODE_SIGNING_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CODE_SIGNING_CLIENT_ID }}
      - name: Upload artifacts
        # Upstream gates this on `inputs.upload-artifacts` (only `true` when
        # the workflow is invoked via `workflow_call` from an external release
        # workflow). The fork wants the artifacts available on every push/PR
        # so the gate is removed. macOS produces a `.zip` per arch (now built
        # by electron-builder), Windows produces an NSIS `.exe` plus the
        # `latest.yml` manifest that `electron-updater` reads.
        uses: actions/upload-artifact@v4
        with:
          name: ${{matrix.friendlyName}}-${{matrix.arch}}
          path: |
            dist/GitHubDesktop-mac-${{matrix.arch}}-*.zip
            dist/GitHubDesktopSetup-${{matrix.arch}}-*.exe
            dist/latest*.yml
            dist/bundle-size.json
          if-no-files-found: error
  e2e-smoke:
    name: E2E Smoke ${{ matrix.friendlyName }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            friendlyName: macOS
            arch: arm64
          - os: windows-2022
            friendlyName: Windows
            arch: x64
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    env:
      RELEASE_CHANNEL: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          submodules: recursive
      - uses: ./.github/actions/setup-ci-environment
        with:
          node-version: ${{ env.NODE_VERSION }}
          arch: ${{ matrix.arch }}
          install-ffmpeg: 'true'
      - name: Build production app
        run: yarn build:prod
        env:
          DESKTOP_E2E_UPDATES_URL: http://127.0.0.1:51789/update
          DESKTOP_OAUTH_CLIENT_ID: ${{ secrets.DESKTOP_OAUTH_CLIENT_ID }}
          DESKTOP_OAUTH_CLIENT_SECRET:
            ${{ secrets.DESKTOP_OAUTH_CLIENT_SECRET }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APPLICATION_CERT: ${{ secrets.APPLE_APPLICATION_CERT }}
          KEY_PASSWORD: ${{ secrets.APPLE_APPLICATION_CERT_PASSWORD }}
          npm_config_arch: ${{ matrix.arch }}
          TARGET_ARCH: ${{ matrix.arch }}
      - name: Prepare testing environment
        run: yarn test:setup
        env:
          npm_config_arch: ${{ matrix.arch }}
      - if: runner.os == 'Windows'
        uses: ./.github/actions/setup-windows-signing
        with:
          enabled: ${{ inputs.sign }}
          azure-client-id: ${{ secrets.AZURE_CODE_SIGNING_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_CODE_SIGNING_TENANT_ID }}
      - name: Package production app
        run: yarn package
        env:
          npm_config_arch: ${{ matrix.arch }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_CODE_SIGNING_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CODE_SIGNING_CLIENT_ID }}
      - name: Install app on macOS
        if: runner.os == 'macOS'
        run: |
          rm -rf "/Applications/GitHub Desktop.app"
          ditto "dist/GitHub Desktop-darwin-arm64/GitHub Desktop.app" "/Applications/GitHub Desktop.app"
          echo "DESKTOP_E2E_APP_PATH=/Applications/GitHub Desktop.app/Contents/MacOS/GitHub Desktop" >> "$GITHUB_ENV"
      - name: Install app on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # NSIS installer name now includes the version
          # (`electron-builder.yml` → `nsis.artifactName`), so glob it
          # rather than hard-coding the suffix.
          $setupExe = Get-ChildItem "dist/GitHubDesktopSetup-${{ matrix.arch }}-*.exe" |
            Select-Object -First 1 -ExpandProperty FullName

          if (-not $setupExe) {
            throw "No NSIS installer found at dist/GitHubDesktopSetup-${{ matrix.arch }}-*.exe"
          }

          $installer = Start-Process -FilePath $setupExe -ArgumentList "/S" -PassThru
          try {
            Wait-Process -Id $installer.Id -Timeout 300 -ErrorAction Stop
          } catch {
            throw "Windows installer timed out after 300 seconds"
          }

          Get-Process GitHubDesktop -ErrorAction SilentlyContinue | Stop-Process -Force

          # electron-builder NSIS with `oneClick: false` + `perMachine: false`
          # installs to `%LOCALAPPDATA%\Programs\<productName>\`. The main
          # exe keeps the name electron-packager produced earlier
          # (`GitHubDesktop.exe`, no space), set via `getExecutableName()`
          # in script/build.ts.
          $installedExe = "$env:LOCALAPPDATA\Programs\GitHub Desktop\GitHubDesktop.exe"

          if (-not (Test-Path $installedExe)) {
            # Fall back to a recursive search inside the install root in
            # case electron-builder ever changes the layout.
            $installedExe = Get-ChildItem "$env:LOCALAPPDATA\Programs\GitHub Desktop" -Recurse -Filter "GitHubDesktop.exe" -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }

          if (-not $installedExe -or -not (Test-Path $installedExe)) {
            throw "Unable to locate installed GitHub Desktop executable under $env:LOCALAPPDATA\Programs\GitHub Desktop"
          }

          Add-Content -Path $env:GITHUB_ENV -Value "DESKTOP_E2E_APP_PATH=$installedExe"
      - name: Run packaged E2E smoke tests
        run: yarn test:e2e:run:packaged
      - name: Upload E2E artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{matrix.friendlyName}}-${{matrix.arch}}
          path: playwright-videos/**
          if-no-files-found: warn
