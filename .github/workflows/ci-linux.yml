name: 'CI / Linux'

on:
  push:
    branches:
      - development
      - linux
      - 'linux-release-*'
    tags:
      - 'release-*.*.*'
      - 'release-*.*.*-*'
  pull_request:
    branches:
      - linux
      - linux-vnext
      - 'linux-release-*'

jobs:
  arm64:
    name: Ubuntu arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          submodules: recursive
      - name: Package and test application in container
        uses: ./.github/actions/ubuntu-arm64-packaging
      - name: Upload output artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-arm64-artifacts
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.sha256
          retention-days: 5
          if-no-files-found: error
  arm:
    name: Ubuntu arm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          submodules: recursive
      - name: Package and test application in container
        uses: ./.github/actions/ubuntu-arm-packaging
      - name: Upload output artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-arm-artifacts
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.sha256
          retention-days: 5
          if-no-files-found: error
  amd64:
    name: Ubuntu x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          submodules: recursive
      - name: Package and test application in container
        uses: ./.github/actions/ubuntu-amd64-packaging
      - name: Upload output artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-amd64-artifacts
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.sha256
          retention-days: 5
          if-no-files-found: error

  publish:
    name: Create GitHub release
    needs: [arm64, arm, amd64]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22.22.2
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: yarn

      # `docker/build-push-action@v6` uploads `*.dockerbuild` build-record
      # artifacts as a side-effect (for the GHA build summary UI). They're
      # not part of the release; filter to just the packaged-output
      # artifacts so a transient failure on one of those metadata blobs
      # doesn't kill the publish job.
      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          path: './artifacts'
          pattern: ubuntu-*-artifacts

      - name: Wait for CI workflow (Windows/macOS) and download its artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The `CI` workflow runs in parallel on the same tag push and produces
          # the Windows/macOS artifacts. Find its run for this commit, wait
          # until it completes, then pull every artifact into ./artifacts/ so
          # the release step picks them up alongside the Linux ones.
          set -euo pipefail

          RUN_ID=""
          for attempt in $(seq 1 60); do
            RUN_ID=$(gh run list \
              --workflow=ci.yml \
              --commit="$GITHUB_SHA" \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty' || true)
            if [ -n "$RUN_ID" ]; then break; fi
            echo "Waiting for CI run on $GITHUB_SHA to appear (attempt $attempt)..."
            sleep 10
          done

          if [ -z "$RUN_ID" ]; then
            echo "::warning::Could not locate a CI workflow run for $GITHUB_SHA — release will only contain Linux artifacts."
            exit 0
          fi

          echo "Found CI run $RUN_ID — waiting for completion..."
          gh run watch "$RUN_ID" --exit-status --repo "$GITHUB_REPOSITORY" \
            || echo "::warning::CI run $RUN_ID did not finish cleanly; continuing with whatever artifacts are available."

          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --dir ./artifacts \
            || echo "::warning::Failed to download CI artifacts; release may be missing Windows/macOS files."

      - name: Display structure of downloaded files
        run: ls -R
        working-directory: './artifacts'

      - name: Get tag name without prefix
        run: |
          RELEASE_TAG=${GITHUB_REF/refs\/tags\//}
          echo "RELEASE_TAG=${RELEASE_TAG}" >> $GITHUB_ENV
          tagNameWithoutPrefix="${RELEASE_TAG:8}"
          echo "RELEASE_TAG_WITHOUT_PREFIX=${tagNameWithoutPrefix}" >> $GITHUB_ENV
          # `update.electronjs.org` rejects `release-3.5.9` tags because
          # `semver.clean()` only accepts a leading `v` (or no prefix). The
          # GitHub Release we publish therefore lives on a sibling `vX.Y.Z`
          # tag that the action creates at the same SHA. Respin suffixes
          # (`-2`, `-3`, …) collapse onto the same `v` tag so the update
          # server always sees one canonical Release per upstream version.
          upstreamVersion="${tagNameWithoutPrefix%%-*}"
          echo "UPDATE_TAG=v${upstreamVersion}" >> $GITHUB_ENV

      - name: Generate release notes
        run: |
          node -v
          yarn
          node -r ts-node/register script/generate-release-notes.ts "${{ github.workspace }}/artifacts" "${{ env.RELEASE_TAG_WITHOUT_PREFIX }}"
          RELEASE_NOTES_FILE=script/release_notes.txt
          if [[ ! -f "$RELEASE_NOTES_FILE" ]]; then
              echo "$RELEASE_NOTES_FILE does not exist. Something might have gone wrong while generating the release notes."
              exit 1
          fi
          echo "Release notes:"
          echo "---"
          cat ${RELEASE_NOTES_FILE}
          echo "---"

      # Respin support: if a `vX.Y.Z` Release already exists (from a previous
      # respin of the same upstream version), drop it before creating the
      # new one. `gh release delete` with `--cleanup-tag` also removes the
      # git tag so action-gh-release can recreate it cleanly.
      - name: Replace existing v-tag Release if any
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$UPDATE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Existing Release for $UPDATE_TAG found — replacing it."
            gh release delete "$UPDATE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --cleanup-tag \
              --yes
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          # Tag the Release on `vX.Y.Z` (clean semver) so update.electronjs
          # .org recognises it. The `release-X.Y.Z[-N]` git tag that
          # triggered this workflow stays around as a CI artefact.
          tag_name: ${{ env.UPDATE_TAG }}
          name: GitHub Desktop ${{ env.RELEASE_TAG_WITHOUT_PREFIX }}
          body_path: script/release_notes.txt
          files: |
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.sha256
            artifacts/**/*.exe
            artifacts/**/*.msi
            artifacts/**/*.nupkg
            artifacts/**/*.zip
          draft: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
